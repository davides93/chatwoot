#
# Builds and publishes this fork's chatwoot image to ghcr.io on version tags
# (v4.15.1, v4.15.2, ... — same tag convention as upstream releases), linux/amd64
# only since the target cluster runs amd64 nodes. Also creates a GitHub Release
# for the tag (GitHub auto-attaches source zip/tar.gz; no extra asset needed —
# release notes just link to the published image).
#
# Separate from publish_foss_docker.yml / publish_ee_docker.yml, which target
# upstream's DockerHub release.
#

name: Publish to GHCR (fork)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${IMAGE_TAG}" \
            --title "${IMAGE_TAG}" \
            --generate-notes \
            --notes "Docker image: \`${IMAGE_NAME}:${IMAGE_TAG}\`

          Pull:
          \`\`\`
          docker pull ${IMAGE_NAME}:${IMAGE_TAG}
          \`\`\`"
