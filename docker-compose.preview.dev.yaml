# Dev-like preview — hot-reload stack (mirrors docker-compose.yaml: separate rails/vite,
# source mounted live). Isolated ports/volumes/network from your normal dev stack so both
# can run side by side. Every dependency below is a local-only container.
#
# Setup:
#   cp .env.preview.example .env.preview   # then set SECRET_KEY_BASE
#   docker compose -f docker-compose.preview.dev.yaml up -d postgres redis mailhog
#   docker compose -f docker-compose.preview.dev.yaml run --rm rails bundle exec rails db:chatwoot_prepare
#   docker compose -f docker-compose.preview.dev.yaml up
#
# App: http://localhost:3200  Vite: http://localhost:3336  Mailhog UI: http://localhost:8027

name: chatwoot-preview-dev

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    # Must stay chatwoot:development — docker/dockerfiles/rails.Dockerfile and
    # vite.Dockerfile hardcode `FROM chatwoot:development` (not parameterized).
    # Harmless to share with docker-compose.yaml's `base`: same Dockerfile, same args.
    image: chatwoot:development
    env_file: .env.preview

  rails:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: chatwoot-preview-dev-rails:latest
    volumes:
      - ./:/app:delegated
      - preview_dev_node_modules:/app/node_modules
      - preview_dev_packs:/app/public/packs
      - preview_dev_cache:/app/tmp/cache
      - preview_dev_bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
      - sidekiq
    ports:
      - '3200:3000'
    env_file: .env.preview
    environment:
      - VITE_DEV_SERVER_HOST=vite
      - NODE_ENV=development
      - RAILS_ENV=development
      - FRONTEND_URL=http://localhost:3200
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    image: chatwoot-preview-dev-rails:latest
    volumes:
      - ./:/app:delegated
      - preview_dev_node_modules:/app/node_modules
      - preview_dev_packs:/app/public/packs
      - preview_dev_cache:/app/tmp/cache
      - preview_dev_bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
      - FRONTEND_URL=http://localhost:3200
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  vite:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
    image: chatwoot-preview-dev-vite:latest
    volumes:
      - ./:/app:delegated
      - preview_dev_node_modules:/app/node_modules
      - preview_dev_packs:/app/public/packs
      - preview_dev_cache:/app/tmp/cache
      - preview_dev_bundle:/usr/local/bundle
    ports:
      - '3336:3036'
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite dev

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '5434:5432'
    volumes:
      - preview_dev_postgres:/data/postgres
    environment:
      - POSTGRES_DB=chatwoot_preview
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env.preview
    volumes:
      - preview_dev_redis:/data/redis
    ports:
      - '6381:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1027:1025'
      - '8027:8025'

volumes:
  preview_dev_postgres:
  preview_dev_redis:
  preview_dev_packs:
  preview_dev_node_modules:
  preview_dev_cache:
  preview_dev_bundle:
